name: PSP slide disassembly

on:
  push:
    branches: [codex/psp-slide-disassembly]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install analysis tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool git unzip binutils
      - name: Build PSP Allegrex PRXTool
        run: |
          git clone --depth 1 https://github.com/pspdev/prxtool.git "$RUNNER_TEMP/prxtool"
          cd "$RUNNER_TEMP/prxtool"
          ./bootstrap
          ./configure CXXFLAGS="-O2 -std=gnu++11"
          make -j2
          git rev-parse HEAD > "$RUNNER_TEMP/prxtool-commit.txt"
      - name: Download and verify source modules
        run: |
          mkdir -p "$RUNNER_TEMP/slide-input" "$GITHUB_WORKSPACE/slide-analysis"
          curl --fail --location --retry 3 --max-time 120 \
            https://github.com/NightStar3/zerovsh-patcher/releases/download/0.4/ZeroVSH_Patcher_v0.4.BIN.zip \
            -o "$RUNNER_TEMP/zerovsh.zip"
          python3 - <<'PY'
          import os, zipfile, hashlib, json
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"])
          out = Path(os.environ["GITHUB_WORKSPACE"]) / "slide-analysis"
          expected = {
              "slide_plugin_660.prx": "8cae94bf24e351c8d3e36959c0e95200c109040f55e9ab5586b243236994a10c",
              "slide_plugin_660.rco": "b8b2ca01e519799a6ce17bd40ea30e22a1eca3c68e91f64afac178dc9d8b57e8",
          }
          manifest = {"source": "NightStar3/zerovsh-patcher release 0.4", "firmware_note": "6.60-labeled modules bundled with a release supporting 6.61. Not verified as an exact 6.61 firmware dump.", "files": []}
          with zipfile.ZipFile(root / "zerovsh.zip") as z:
              for name, sha in expected.items():
                  matches = [n for n in z.namelist() if n.endswith("/" + name)]
                  assert len(matches) == 1, matches
                  data = z.read(matches[0])
                  assert hashlib.sha256(data).hexdigest() == sha, name
                  if name.endswith(".prx"):
                      assert data[:4] == b"\x7fELF"
                  (root / "slide-input" / name).write_bytes(data)
                  manifest["files"].append({"name": name, "bytes": len(data), "sha256": sha})
          manifest["prxtool_commit"] = (root / "prxtool-commit.txt").read_text().strip()
          (out / "provenance.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Disassemble and inspect
        run: |
          input="$RUNNER_TEMP/slide-input/slide_plugin_660.prx"
          output="$GITHUB_WORKSPACE/slide-analysis"
          tool="$RUNNER_TEMP/prxtool/prxtool"
          readelf -h -l -S "$input" > "$output/elf-layout.txt"
          "$tool" -m "$input" > "$output/module-info.txt" 2> "$output/module-info.log"
          "$tool" -f "$input" > "$output/imports-exports.txt" 2> "$output/imports-exports.log"
          "$tool" -w -o "$output/slide_plugin_660.asm" "$input" 2> "$output/disassembly.log"
          "$tool" -x -o "$output/module.xml" "$input" 2> "$output/xml.log"
          strings -a -t x "$input" > "$output/strings.txt"
          strings -a -t x "$RUNNER_TEMP/slide-input/slide_plugin_660.rco" > "$output/rco-strings.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          out = Path(os.environ["GITHUB_WORKSPACE"]) / "slide-analysis"
          asm = (out / "slide_plugin_660.asm").read_text(errors="replace")
          assert len(asm) > 1000, "Disassembly unexpectedly empty"
          lines = asm.splitlines()
          candidates = []
          for i, line in enumerate(lines):
              if re.search(r"0x0*100\b|0x0*200\b|sceCtrl|slide|clock|paf", line, re.I):
                  candidates.append("\n".join(lines[max(0,i-4):i+6]))
          (out / "input-candidates.txt").write_text(
              "Unverified search candidates. 0x100/0x200 are L/R masks, but occurrences alone do not establish input handling.\n\n"
              + "\n\n".join(candidates[:250]) + "\n")
          (out / "README.txt").write_text(
              "PSP slide module disassembly\n"
              "Source PRX is labeled 6.60; source release supports 6.61. No hardware verification.\n"
              "Assembly is produced by pspdev/prxtool with its PSP/Allegrex disassembler.\n"
              "This is disassembly, not recovered original C source.\n"
              "Input candidates are heuristic and require manual tracing.\n"
              "No original Sony binaries are included in this artifact.\n")
          print("ASSEMBLY_LINES", len(lines))
          print("MODULE INFO\n", (out / "module-info.txt").read_text(errors="replace")[:10000])
          print("IMPORTS / EXPORTS\n", (out / "imports-exports.txt").read_text(errors="replace")[:20000])
          PY
      - name: Upload analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PSP-slide-disassembly
          path: slide-analysis/
          if-no-files-found: error
          retention-days: 90
