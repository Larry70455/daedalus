name: PSP slide disassembly

on:
  push:
    branches: [codex/psp-slide-disassembly]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disassemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential autoconf automake libtool git curl python3 binutils
      - name: Disassemble verified slide module
        run: bash Tools/SlideAnalysis/disassemble.sh "$GITHUB_WORKSPACE/slide-analysis"
      - name: Upload analysis and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psp-slide-disassembly
          path: slide-analysis/
          if-no-files-found: error
          retention-days: 90
